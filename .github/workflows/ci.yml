name: Preview verification
on:
  push:
  pull_request:
concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - run: npm ci --no-audit --no-fund
      - uses: actions/upload-artifact@v4
        with:
          name: dependency-lock
          path: package-lock.json
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: node scripts/audit-preview.mjs dist
      - run: node scripts/audit-size.mjs dist
      - run: npm run build:workspace
      - run: node scripts/audit-preview.mjs dist-workspace
      - run: node scripts/audit-size.mjs dist-workspace
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:browser
      - run: node scripts/browser-release.mjs
      - run: npm run audit:performance
      - name: Dependency security audit
        if: always() && hashFiles('package-lock.json') != ''
        run: npm run audit:dependencies
      - uses: actions/upload-artifact@v4
        with:
          name: public-preview-build
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: private-workspace-preview-build
          path: dist-workspace/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-preview-screenshots
          path: test-artifacts/
          if-no-files-found: ignore
