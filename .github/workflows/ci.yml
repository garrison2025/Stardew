name: Preview verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: node scripts/audit-preview.mjs dist
      - run: node scripts/audit-size.mjs dist
      - run: npm run build:workspace
      - run: node scripts/audit-preview.mjs dist-workspace
      - run: node scripts/audit-size.mjs dist-workspace
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        with:
          name: public-preview-build
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: private-workspace-preview-build
          path: dist-workspace/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-preview-screenshots
          path: test-artifacts/
          if-no-files-found: ignore
