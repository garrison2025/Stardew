name: Preview verification
on:
  push:
  pull_request:
concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Prepare dependency lock if absent
        run: |
          if [ ! -f package-lock.json ]; then
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          fi
      - run: npm ci --no-audit --no-fund
      - uses: actions/upload-artifact@v4
        with:
          name: dependency-lock
          path: package-lock.json
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: node scripts/audit-preview.mjs dist
      - run: node scripts/audit-size.mjs dist
      - run: npm run build:workspace
      - run: node scripts/audit-preview.mjs dist-workspace
      - run: node scripts/audit-size.mjs dist-workspace
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:browser
      - run: node scripts/browser-release.mjs
      - name: Dependency security audit
        if: always() && hashFiles('package-lock.json') != ''
        run: npm run audit:dependencies
      - uses: actions/upload-artifact@v4
        with:
          name: public-preview-build
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: private-workspace-preview-build
          path: dist-workspace/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-preview-screenshots
          path: test-artifacts/
          if-no-files-found: ignore
  export-lock:
    if: github.event_name == 'push' && github.ref == 'refs/heads/fix/final-audit-consolidated-20261127'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Export generated lock for review
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          node -e "const {packages,...meta}=require('./package-lock.json');console.log('LOCK_META '+JSON.stringify(meta));for(const item of Object.entries(packages))console.log('LOCK_ENTRY '+JSON.stringify(item));console.log('LOCK_COUNT '+Object.keys(packages).length)"
