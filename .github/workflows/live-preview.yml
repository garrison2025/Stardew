name: Live preview verification
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'scripts/audit-live-preview.mjs'
      - '.github/workflows/live-preview.yml'
  workflow_dispatch:
    inputs:
      public_origin:
        description: Public HTTPS preview origin
        required: true
        default: https://stardew-67b.pages.dev
      private_origin:
        description: Distinct private HTTPS workspace origin (optional; blank is public-only)
        required: false
        default: https://stardew-local-workspace.pages.dev
      revision:
        description: Expected full 40-character deployed Git SHA
        required: true
concurrency:
  group: live-preview-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Read-only deployment audit
        env:
          PUBLIC_ORIGIN: ${{ inputs.public_origin || 'https://stardew-67b.pages.dev' }}
          PRIVATE_ORIGIN: ${{ github.event_name != 'workflow_dispatch' && 'https://stardew-local-workspace.pages.dev' || inputs.private_origin }}
          EXPECTED_REVISION: ${{ github.event_name == 'push' && github.sha || inputs.revision }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p live-evidence
          args=("$PUBLIC_ORIGIN")
          if [ -n "$PRIVATE_ORIGIN" ]; then args+=("$PRIVATE_ORIGIN"); fi
          if [ -n "$EXPECTED_REVISION" ]; then args+=(--revision "$EXPECTED_REVISION"); fi
          if [ "$EVENT_NAME" = push ]; then
            # Cloudflare builds the two origins asynchronously. Poll only the public
            # revision markers, then run the full audit once on the matching pair.
            for attempt in $(seq 1 24); do
              if node --input-type=module -e '
                const expected=process.env.EXPECTED_REVISION;
                const origins=[process.env.PUBLIC_ORIGIN,process.env.PRIVATE_ORIGIN];
                try {
                  await Promise.all(origins.map(async origin=>{
                    const r=await fetch(origin+"/",{cache:"no-store",redirect:"manual",signal:AbortSignal.timeout(10000)});
                    const html=await r.text();
                    const actual=html.match(/<meta\s+name="build-revision"\s+content="([0-9a-f]{40})"/i)?.[1];
                    console.log(origin+": HTTP "+r.status+", revision "+(actual??"missing"));
                    if(r.status!==200||actual!==expected)throw Error("Revision not deployed");
                  }));
                } catch(error) { console.error(String(error)); process.exitCode=1; }
              ' 2>&1 | tee -a live-evidence/revision.txt; then
                break
              fi
              if [ "$attempt" -eq 24 ]; then
                echo "Both origins did not reach expected revision $EXPECTED_REVISION" | tee -a live-evidence/revision.txt
                exit 1
              fi
              sleep 20
            done
          fi
          node scripts/audit-live-preview.mjs "${args[@]}" 2>&1 | tee live-evidence/audit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-preview-verification
          path: live-evidence/
