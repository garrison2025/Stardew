name: Live preview verification
on:
  workflow_dispatch:
    inputs:
      public_origin:
        description: Public HTTPS preview origin
        required: true
        default: https://stardew-67b.pages.dev
      private_origin:
        description: Distinct private HTTPS workspace origin (optional; blank is public-only)
        required: false
      revision:
        description: Expected full 40-character deployed Git SHA
        required: true
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Read-only deployment audit
        env:
          PUBLIC_ORIGIN: ${{ inputs.public_origin }}
          PRIVATE_ORIGIN: ${{ inputs.private_origin }}
          EXPECTED_REVISION: ${{ inputs.revision }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p live-evidence
          args=("$PUBLIC_ORIGIN")
          if [ -n "$PRIVATE_ORIGIN" ]; then args+=("$PRIVATE_ORIGIN"); fi
          node scripts/audit-live-preview.mjs "${args[@]}" --revision "$EXPECTED_REVISION" 2>&1 | tee live-evidence/audit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-preview-verification
          path: live-evidence/
